<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Three machine learning projects: placement prediction, heart disease prediction with 87% accuracy and 85% F1, and house price prediction">
  <rect width="1000" height="300" rx="14" fill="#0B0D10"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">

    <!-- card 1 -->
    <rect x="40" y="20" width="280" height="260" rx="10" fill="#14181D" stroke="#232A31"/>
    <text x="64" y="54" font-size="12" fill="#8A949E" letter-spacing="2">01</text>
    <text x="64" y="92" font-size="26" font-weight="700" fill="#E8E6DF">Placement</text>
    <text x="64" y="122" font-size="26" font-weight="700" fill="#C6FF3D">Prediction</text>
    <text x="64" y="150" font-size="13" fill="#FF6B3D">SVM · Streamlit</text>
    <text x="64" y="176" font-size="12.5" fill="#E8E6DF">End-to-end classifier: EDA,</text>
    <text x="64" y="194" font-size="12.5" fill="#E8E6DF">cross-validation, tuning, live app.</text>
    <path d="M64 232H296" stroke="#232A31" stroke-width="2" stroke-dasharray="3 5"/>
    <g fill="#14181D" stroke="#C6FF3D" stroke-width="2"><circle cx="64" cy="232" r="4"/><circle cx="180" cy="232" r="4"/><circle cx="296" cy="232" r="4"/></g>
    <circle r="5" fill="#C6FF3D"><animateMotion path="M64 232H296" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <g font-size="11" fill="#8A949E"><text x="64" y="260">data</text><text x="180" y="260" text-anchor="middle">model</text><text x="296" y="260" text-anchor="end">app</text></g>

    <!-- card 2 -->
    <rect x="360" y="20" width="280" height="260" rx="10" fill="#14181D" stroke="#232A31"/>
    <text x="384" y="54" font-size="12" fill="#8A949E" letter-spacing="2">02</text>
    <text x="384" y="92" font-size="26" font-weight="700" fill="#E8E6DF">Heart Disease</text>
    <text x="384" y="122" font-size="26" font-weight="700" fill="#C6FF3D">Prediction</text>
    <text x="384" y="150" font-size="13" fill="#FF6B3D">Logistic Regression · Streamlit</text>
    <text x="384" y="176" font-size="12.5" fill="#E8E6DF">Clinical data to a real-time</text>
    <text x="384" y="194" font-size="12.5" fill="#E8E6DF">health risk assessment app.</text>
    <text x="384" y="228" font-size="12" font-weight="700" fill="#E8E6DF">ACC 87%</text>
    <rect x="464" y="220" width="152" height="8" rx="4" fill="#232A31"/>
    <rect x="464" y="220" width="0" height="8" rx="4" fill="#C6FF3D">
      <animate attributeName="width" values="0;132;132" keyTimes="0;0.25;1" dur="6s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="384" y="256" font-size="12" font-weight="700" fill="#E8E6DF">F1  85%</text>
    <rect x="464" y="248" width="152" height="8" rx="4" fill="#232A31"/>
    <rect x="464" y="248" width="0" height="8" rx="4" fill="#FF6B3D">
      <animate attributeName="width" values="0;129;129" keyTimes="0;0.25;1" dur="6s" begin="0.7s" repeatCount="indefinite"/>
    </rect>

    <!-- card 3 -->
    <rect x="680" y="20" width="280" height="260" rx="10" fill="#14181D" stroke="#232A31"/>
    <text x="704" y="54" font-size="12" fill="#8A949E" letter-spacing="2">03</text>
    <text x="704" y="92" font-size="26" font-weight="700" fill="#E8E6DF">House Price</text>
    <text x="704" y="122" font-size="26" font-weight="700" fill="#C6FF3D">Prediction</text>
    <text x="704" y="150" font-size="13" fill="#FF6B3D">Linear Regression · Pandas</text>
    <text x="704" y="176" font-size="12.5" fill="#E8E6DF">Feature selection and outlier</text>
    <text x="704" y="194" font-size="12.5" fill="#E8E6DF">handling in one clean pipeline.</text>
    <path d="M704 232H936" stroke="#232A31" stroke-width="2" stroke-dasharray="3 5"/>
    <g fill="#14181D" stroke="#C6FF3D" stroke-width="2"><circle cx="704" cy="232" r="4"/><circle cx="820" cy="232" r="4"/><circle cx="936" cy="232" r="4"/></g>
    <circle r="5" fill="#C6FF3D"><animateMotion path="M704 232H936" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
    <g font-size="11" fill="#8A949E"><text x="704" y="260">data</text><text x="820" y="260" text-anchor="middle">model</text><text x="936" y="260" text-anchor="end">estimate</text></g>
  </g>
</svg>
